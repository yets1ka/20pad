<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ZOundPad n0u</title>
<style>
:root{--bg:#0d0d0f;--panel:#16161a;--line:#2a2a30;--acc:#00ffcc;--amber:#ffb000;--hot:#ff0055;--txt:#e1e1e6;--dim:#7a7a85}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:14px/1.3 "Courier New",monospace;padding:max(10px,env(safe-area-inset-top)) 10px 40px;touch-action:manipulation}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hist{margin-left:auto;display:flex;gap:6px}
.hist button:disabled{opacity:.35}
h1{font-size:18px;color:var(--acc);letter-spacing:.5px}
.ver{color:var(--dim);font-size:12px}
button,select,input[type=number]{font:inherit;color:var(--txt);background:#23232a;border:1px solid var(--line);border-radius:6px;min-height:40px;padding:0 12px}
input[type=text]{font:inherit;font-size:16px;color:var(--txt);background:#23232a;border:1px solid var(--line);border-radius:6px;min-height:42px;padding:0 10px;-webkit-user-select:text;user-select:text}
button:active{background:#33333c}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.grp{display:flex;flex-direction:column;gap:4px}
.grp>label{font-size:11px;color:var(--dim)}
.inline{display:flex;gap:6px;align-items:center}
.play{background:var(--acc);color:#001a14;font-weight:bold;min-width:110px;min-height:46px;border:0}
.play.on{background:var(--hot);color:#fff}
#bpm{width:70px;text-align:center}
.lcd{display:inline-block;min-width:110px;padding:10px;border-radius:6px;background:#050507;border:1px solid var(--line);color:var(--acc);text-align:center}
.add{display:flex;gap:8px;margin-bottom:10px}
.mach{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;overflow-x:auto}
.mh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.mt{margin-right:auto;font-size:15px}
.sm{min-height:34px;padding:0 10px;font-size:12px}
.sm.red{background:var(--hot);border-color:var(--hot);color:#fff}
.dim{color:var(--dim);font-size:11px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-width:560px}
.lb{width:70px;min-height:36px;padding:0;font-size:12px;text-align:left;padding-left:8px;flex:none}
.steps{display:flex;gap:3px;flex:1}
.st{flex:1;min-width:24px;height:38px;border-radius:5px;background:#26262d;border:1px solid #33333b}
.st.g4{margin-left:7px}
.st.on{background:var(--acc);border-color:var(--acc)}
.st.acc{background:var(--amber);border-color:var(--amber)}
.st.ph{box-shadow:inset 0 0 0 3px var(--hot)}
.st:not(.on):not(.acc).ph{background:#4a2434}
input[type=range]{width:70px;flex:none;accent-color:var(--acc)}
.vv{width:64px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:7;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(520px,100%);max-height:80vh;display:flex;flex-direction:column;gap:10px}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;flex-wrap:wrap;gap:6px}
.pl{flex:1;text-align:left}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--acc);color:#001a14;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
#toast.show{opacity:1}
#err{display:none;position:fixed;left:8px;right:8px;bottom:8px;background:#400014;border:1px solid var(--hot);border-radius:8px;padding:10px;color:#fff;font-size:12px;z-index:9;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<header><h1>ZOundPad n0u</h1><span class="ver" id="ver"></span><div class="hist"><button id="undo" disabled>↶ Undo</button><button id="redo" disabled>Redo ↷</button></div></header>

<div class="bar">
  <button id="play" class="play">▶ Play</button>
  <div class="grp"><label>Tempo (BPM)</label>
    <div class="inline"><button id="bm">−</button><input id="bpm" type="number" min="40" max="240" value="120"><button id="bp">+</button></div></div>
  <div class="grp"><label>Master volume</label><input id="mv" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  <div class="grp"><label>Editing section</label>
    <div class="inline"><select id="secSel"></select><span class="dim" id="secCount"></span><button id="addSec" title="New empty section">+ New</button><button id="copySec" title="Copy this section to memory">Copy</button><button id="pasteSec" title="Paste the copied pattern into the section you are editing" disabled>Paste</button></div><span class="dim" id="clipInfo">nothing copied</span></div>
  <div class="grp"><label>Now playing</label><span class="lcd" id="pos">stopped</span></div>
</div>

<div class="add"><button id="add808">+ TR-808</button><button id="add909">+ TR-909</button></div>
<div id="rack"></div>
<div id="toast"></div>
<div id="err"></div>

<script>
/* ZOundPad n0u
   Engine: lookahead scheduler (audio clock), per-machine channel strip -> master -> compressor.
   Drum voices are synthesized here (no samples, no third-party code). */
const VERSION = 'v1.05';
const $ = s => document.querySelector(s);
function showErr(m){ const b = $('#err'); b.textContent = '⚠ ' + m; b.style.display = 'block'; }
window.addEventListener('error', e => showErr(e.message + ' (line ' + (e.lineno||'?') + ')'));
window.addEventListener('unhandledrejection', e => showErr(String(e.reason)));
$('#ver').textContent = VERSION;

const VOICES = [['kick','KICK'],['snare','SNARE'],['clap','CLAP'],['rim','RIMSHOT'],['chh','CLOSED HAT'],['ohh','OPEN HAT'],['ltom','LOW TOM'],['mtom','MID TOM'],['htom','HI TOM'],['crash','CRASH']];
const STEPS = 16;
const S = { bpm:120, mv:0.8, playing:false, section:0, step:0, view:0, machines:[], sections:[], nextId:1, count:{} };
let ctx, master, noiseBuf;
const CURVE = (() => { const c = new Float32Array(256); for (let i=0;i<256;i++){ c[i] = Math.tanh((i/128-1)*2.2); } return c; })();

/* ---------- audio core ---------- */
function initAudio(){
  if (!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint:'interactive' });
    master = ctx.createGain(); master.gain.value = S.mv;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate*3, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    S.machines.forEach(ensureOut);
  }
  if (ctx.state !== 'running') ctx.resume();
}
function ensureOut(m){ if (!m.out){ m.out = ctx.createGain(); m.out.gain.value = m.mute ? 0 : m.vol; m.out.connect(master); } }

/* ---------- synth helpers ---------- */
const gn = (v=1) => { const g = ctx.createGain(); g.gain.value = v; return g; };
const mk = (type,f,q) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q) n.Q.value = q; return n; };
const link = (...n) => { for (let i=0;i<n.length-1;i++) n[i].connect(n[i+1]); };
function env(g,t,peak,dec,atk=0.002){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(Math.max(peak,0.0002),t+atk); g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec); }
function wash(g,t,peak,mid,dur){
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.004);
  g.gain.exponentialRampToValueAtTime(Math.max(peak*mid,0.0002),t+0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
}
function osc(type,f0,f1,t,sweep,stop,dest){
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0,t);
  if (sweep>0 && f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+sweep);
  o.start(t); o.stop(t+stop); o.connect(dest);
}
function ns(t,dur){ const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.start(t, Math.random()*Math.max(0,2.9-dur), dur); return s; }

function hat(k,t,v,d,open,m){
  if (m.oh){ m.oh.gain.setTargetAtTime(0,t,0.004); m.oh = null; }
  const cg = gn(1), g = gn(0), bp = mk('bandpass',10000,0.8), hp = mk('highpass',7000,0.7);
  const base = k==='808' ? 205.3 : 228;
  [1,1.4471,1.617,1.9265,2.5028,2.6637].forEach(r => osc('square',base*r,base*r,t,0,open?0.7:0.2,bp));
  const dec = open ? (k==='808'?0.38:0.5) : (k==='808'?0.05:0.065);
  env(g,t,v*0.45,dec); link(bp,hp,g,cg,d);
  if (open) m.oh = cg;
}
function tom(k,t,v,d,f){ const g = gn(0); env(g,t,v*0.9,k==='808'?0.38:0.3); osc('sine',f*1.6,f,t,0.07,0.5,g); g.connect(d); }

const V = {
  kick(k,t,v,d){
    const r = k==='808', g = gn(0);
    env(g,t,v*(r?1.1:1.2),r?0.85:0.42);
    osc('sine',r?170:230,r?46:50,t,r?0.1:0.055,r?0.95:0.5,g);
    if (r){ g.connect(d); }
    else {
      const w = ctx.createWaveShaper(); w.curve = CURVE; link(g,w,d);
      const c = gn(0), n = ns(t,0.02), f = mk('bandpass',3200,1); env(c,t,v*0.35,0.012); link(n,f,c,d);
    }
  },
  snare(k,t,v,d){
    const r = k==='808', g = gn(0), n = gn(0);
    env(g,t,v*0.55,r?0.14:0.11);
    osc('triangle',r?190:200,r?170:160,t,0.04,0.25,g); osc('sine',r?330:340,r?330:340,t,0,0.25,g); g.connect(d);
    const hp = mk('highpass',r?2200:1800); env(n,t,v*(r?0.45:0.7),r?0.2:0.17); link(ns(t,0.4),hp,n,d);
  },
  clap(k,t,v,d){
    const r = k==='808';
    for (let i=0;i<4;i++){
      const s = t+i*0.011, g = gn(0), f = mk('bandpass',r?1100:1400,1.3);
      env(g,s,v*0.9,i<3?0.01:(r?0.26:0.19),0.001); link(ns(s,0.3),f,g,d);
    }
  },
  rim(k,t,v,d){
    const r = k==='808', g = gn(0);
    env(g,t,v*0.5,0.04,0.001); osc('triangle',1650,1650,t,0,0.08,g); osc('triangle',r?455:520,r?455:520,t,0,0.08,g); g.connect(d);
    if (!r){ const c = gn(0), f = mk('highpass',3000); env(c,t,v*0.3,0.015,0.001); link(ns(t,0.03),f,c,d); }
  },
  chh(k,t,v,d,m){ hat(k,t,v,d,false,m); },
  ohh(k,t,v,d,m){ hat(k,t,v,d,true,m); },
  ltom(k,t,v,d){ tom(k,t,v,d,k==='808'?92:105); },
  mtom(k,t,v,d){ tom(k,t,v,d,k==='808'?130:145); },
  htom(k,t,v,d){ tom(k,t,v,d,k==='808'?175:195); },
  crash(k,t,v,d){
    const r = k==='808', dur = r ? 1.5 : 1.9;
    const a = gn(0), hp = mk('highpass',r?2800:3600,0.5), lp = mk('lowpass',15000);
    wash(a,t,v*0.5,0.3,dur); link(ns(t,dur),hp,lp,a,d);
    const b = gn(0), bp = mk('bandpass',7500,0.7);
    wash(b,t,v*0.35,0.5,dur); link(ns(t,dur),bp,b,d);
    const c = gn(0), ch = mk('highpass',6000); env(c,t,v*0.4,0.02,0.001); link(ns(t,0.03),ch,c,d);
  }
};
function trigger(m,key,vel,t){ ensureOut(m); V[key](m.kit,t,vel*m.vv[key],m.out,m); }

/* ---------- scheduler (lookahead) ---------- */
let nextT = 0, timer = null, queue = [];
const stepDur = () => 60/S.bpm/4;
function scheduleStep(t){
  const sec = S.sections[S.section];
  S.machines.forEach(m => {
    const pat = sec[m.id]; if (!pat || m.mute) return;
    VOICES.forEach(([k]) => { const x = pat[k][S.step]; if (x) trigger(m,k,x===2?1:0.65,t); });
  });
  queue.push({ step:S.step, section:S.section, t });
  if (++S.step >= STEPS){ S.step = 0; S.section = (S.section+1) % S.sections.length; }
}
function tick(){ while (nextT < ctx.currentTime + 0.12){ scheduleStep(nextT); nextT += stepDur(); } }
function togglePlay(){
  initAudio();
  if (S.playing){
    clearInterval(timer); S.playing = false; queue = []; setPlayhead(-1);
    $('#play').textContent = '▶ Play'; $('#play').classList.remove('on'); $('#pos').textContent = 'stopped';
  } else {
    S.playing = true; S.section = S.view; S.step = 0; nextT = ctx.currentTime + 0.06;
    timer = setInterval(tick,25); tick();
    $('#play').textContent = '■ Stop'; $('#play').classList.add('on');
  }
}

/* ---------- playhead (UI follows audio clock) ---------- */
let ph = [];
function setPlayhead(col){
  ph.forEach(e => e.classList.remove('ph')); ph = [];
  if (col < 0) return;
  S.machines.forEach(m => VOICES.forEach(([k]) => { const e = m.cells[k] && m.cells[k][col]; if (e){ e.classList.add('ph'); ph.push(e); } }));
}
function draw(){
  requestAnimationFrame(draw);
  if (!ctx || !S.playing) return;
  let cur = null;
  while (queue.length && queue[0].t <= ctx.currentTime) cur = queue.shift();
  if (cur){
    setPlayhead(cur.section === S.view ? cur.step : -1);
    $('#pos').textContent = 'sec ' + String(cur.section+1).padStart(3,'0') + ' · step ' + String(cur.step+1).padStart(2,'0');
  }
}

/* ---------- data ---------- */
const emptyPat = () => Object.fromEntries(VOICES.map(([k]) => [k, new Array(STEPS).fill(0)]));
const P = (on, acc=[]) => { const a = new Array(STEPS).fill(0); on.forEach(i => a[i] = 1); acc.forEach(i => a[i] = 2); return a; };
function addMachine(kit){
  const m = { id:S.nextId++, kit, n:(S.count[kit] = (S.count[kit]||0)+1), vol:0.85, mute:false, out:null, oh:null, cells:{},
              vv:Object.fromEntries(VOICES.map(([k]) => [k,0.85])) };
  S.machines.push(m); S.sections.forEach(s => s[m.id] = emptyPat());
  if (ctx) ensureOut(m);
  return m;
}
/* undo / redo: snapshots of the project, last 5 actions. Phase 2 adds synth state to snap()/restore(). */
const H = { undo:[], redo:[], max:5 };
function snap(){
  return JSON.stringify({ sections:S.sections, view:S.view, nextId:S.nextId, count:S.count,
    machines:S.machines.map(m => ({ id:m.id, kit:m.kit, n:m.n, vol:m.vol, mute:m.mute, vv:m.vv })) });
}
function commit(){ H.undo.push(snap()); if (H.undo.length > H.max) H.undo.shift(); H.redo = []; syncHist(); }
function restore(str){
  const o = JSON.parse(str), old = new Map(S.machines.map(m => [m.id,m]));
  S.machines = o.machines.map(d => {
    const ex = old.get(d.id), m = ex || Object.assign({ out:null, oh:null, cells:{} }, d);
    if (ex) old.delete(d.id);
    if (ctx) ensureOut(m);
    return m;
  });
  old.forEach(m => { if (m.out) m.out.disconnect(); });
  S.sections = o.sections; S.view = Math.min(o.view,S.sections.length-1); S.nextId = o.nextId; S.count = o.count;
  if (S.section >= S.sections.length) S.section = 0;
  render();
}
function undo(){ if (!H.undo.length) return; H.redo.push(snap()); restore(H.undo.pop()); syncHist(); }
function redo(){ if (!H.redo.length) return; H.undo.push(snap()); restore(H.redo.pop()); syncHist(); }
function syncHist(){
  $('#undo').disabled = !H.undo.length; $('#redo').disabled = !H.redo.length;
  $('#undo').textContent = '↶ Undo' + (H.undo.length ? ' (' + H.undo.length + ')' : '');
  $('#redo').textContent = 'Redo' + (H.redo.length ? ' (' + H.redo.length + ')' : '') + ' ↷';
}
const pad3 = n => String(n).padStart(3,'0');
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'),1800); }

/* section: new / copy / paste */
function newSection(){
  commit();
  const sec = {}; S.machines.forEach(m => sec[m.id] = emptyPat());
  S.sections.push(sec); S.view = S.sections.length-1; render();
}
function copySection(){
  const src = S.sections[S.view]; S.clip = {};
  S.machines.forEach(m => { S.clip[m.id] = {}; VOICES.forEach(([k]) => S.clip[m.id][k] = src[m.id][k].slice()); });
  $('#clipInfo').textContent = 'copied from section ' + pad3(S.view+1); $('#pasteSec').disabled = false; toast('Copied section ' + pad3(S.view+1));
}
function pasteSection(){
  if (!S.clip) return;
  const cur = S.sections[S.view];
  const hasData = S.machines.some(m => VOICES.some(([k]) => cur[m.id][k].some(x => x)));
  if (hasData && !confirm('Replace section ' + pad3(S.view+1) + ' with the copied pattern?')) return;
  commit();
  S.machines.forEach(m => {
    const c = S.clip[m.id]; if (!c) return;
    VOICES.forEach(([k]) => { for (let i=0;i<STEPS;i++) cur[m.id][k][i] = c[k][i]; });
  });
  render(); toast('Pasted into section ' + pad3(S.view+1));
}

/* drum presets: in-app library (localStorage) + export/import files */
const LIB_KEY = 'n0u.drumPresets';
function libGet(){ try { return JSON.parse(localStorage.getItem(LIB_KEY)) || []; } catch(e){ return []; } }
function libSet(a){ try { localStorage.setItem(LIB_KEY,JSON.stringify(a)); return true; } catch(e){ showErr('Could not save preset: ' + e.message); return false; } }
function presetOf(m,name){
  const p = S.sections[S.view][m.id];
  return { app:'n0u', type:'drum', name, kit:m.kit, pat:Object.fromEntries(VOICES.map(([k]) => [k,p[k].slice()])), vv:Object.assign({},m.vv) };
}
function applyPreset(m,pr){
  commit();
  const p = S.sections[S.view][m.id];
  VOICES.forEach(([k]) => {
    if (pr.pat && Array.isArray(pr.pat[k])) for (let i=0;i<STEPS;i++){ const x = pr.pat[k][i]; p[k][i] = (x===1||x===2) ? x : 0; }
    if (pr.vv && typeof pr.vv[k]==='number') m.vv[k] = Math.min(1,Math.max(0,pr.vv[k]));
  });
  render(); toast('Loaded "' + pr.name + '"');
}
function savePreset(m){
  const ov = h('div','ov'), box = h('div','modal'), close = () => ov.remove();
  ov.onclick = e => { if (e.target===ov) close(); };
  const nm = document.createElement('input'); nm.type = 'text'; nm.maxLength = 40; nm.placeholder = 'Preset name, e.g. Four on the floor';
  const st = document.createElement('input'); st.type = 'text'; st.maxLength = 30; st.placeholder = 'Style, e.g. House, Techno, Hip-hop'; st.setAttribute('list','styles');
  const dl = document.createElement('datalist'); dl.id = 'styles';
  ['House','Techno','Hip-hop','Trap','Breakbeat','Funk','Disco','Pop','Rock','Reggae','Latin','Ambient'].forEach(x => { const o = document.createElement('option'); o.value = x; dl.append(o); });
  const ok = h('button','play','Save'), okx = h('button',null,'Save + export file'), cancel = h('button',null,'Cancel');
  const doSave = exp => {
    const name = nm.value.trim() || 'Untitled', a = libGet(), pr = presetOf(m,name); pr.style = st.value.trim();
    a.push(pr);
    if (libSet(a)){ if (exp) exportPreset(pr); toast('Saved "' + name + '"' + (exp ? ' + file' : '')); close(); }
  };
  ok.onclick = () => doSave(false); okx.onclick = () => doSave(true); cancel.onclick = close;
  const bar = h('div','prow'); bar.append(ok,okx,cancel);
  box.append(h('b',null,'Save drum preset'),nm,st,dl,bar); ov.append(box); document.body.append(ov); nm.focus();
}
function exportPreset(pr){
  const b = new Blob([JSON.stringify(pr,null,1)],{type:'application/json'}), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = (pr.name||'preset').replace(/[^\w\-]+/g,'_') + '.n0udrum.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u),2000);
}
function openLoad(m){
  const ov = h('div','ov'), box = h('div','modal'), list = h('div','plist'), close = () => ov.remove();
  ov.onclick = e => { if (e.target===ov) close(); };
  box.append(h('b',null,'Load drum preset into TR-' + m.kit + ' #' + m.n + ' (section ' + pad3(S.view+1) + ')'));
  const a = libGet();
  if (!a.length) list.append(h('div','dim','No presets yet. Press "Save preset" on a drum machine, or import a file.'));
  a.forEach((pr,i) => {
    const r = h('div','prow'), ld = h('button','pl',pr.name + (pr.style ? ' · ' + pr.style : '') + '  (' + pr.kit + ')');
    ld.onclick = () => { applyPreset(m,pr); close(); };
    const ex = h('button','sm','Export'); ex.onclick = () => exportPreset(pr);
    const dl = h('button','sm','Delete'); dl.onclick = () => { const b = libGet(); b.splice(i,1); libSet(b); close(); openLoad(m); };
    r.append(ld,ex,dl); list.append(r);
  });
  const imp = document.createElement('input'); imp.type = 'file'; imp.accept = '.json,application/json'; imp.style.display = 'none';
  imp.onchange = async () => {
    try {
      const f = imp.files[0]; if (!f) return;
      const items = [].concat(JSON.parse(await f.text())).filter(x => x && x.type==='drum' && x.pat);
      if (!items.length) throw new Error('This file has no drum presets');
      const b = libGet(); items.forEach(x => b.push(x)); libSet(b); close(); openLoad(m); toast('Imported ' + items.length);
    } catch(e){ showErr('Import failed: ' + e.message); }
  };
  const ib = h('button',null,'Import from Files…'); ib.onclick = () => imp.click();
  const cb = h('button',null,'Close'); cb.onclick = close;
  const bar = h('div','prow'); bar.append(ib,cb);
  box.append(list,bar,imp); ov.append(box); document.body.append(ov);
}

/* ---------- UI ---------- */
function h(tag,cls,txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt!=null) e.textContent = txt; return e; }
function range(min,max,val,fn,cls){ const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = 0.01; r.value = val; if (cls) r.className = cls; r.oninput = () => fn(parseFloat(r.value)); return r; }
function paint(m,k,i){
  const p = S.sections[S.view][m.id][k], c = m.cells[k];
  (i==null ? c.map((_,j) => j) : [i]).forEach(j => { c[j].classList.toggle('on',p[j]===1); c[j].classList.toggle('acc',p[j]===2); });
}
function refreshSections(){
  const s = $('#secSel'); s.innerHTML = '';
  S.sections.forEach((_,i) => { const o = h('option',null,String(i+1).padStart(3,'0')); o.value = i; s.append(o); });
  s.value = S.view; $('#secCount').textContent = '/ ' + String(S.sections.length).padStart(3,'0');
}
function render(){
  const rack = $('#rack'); rack.innerHTML = '';
  S.machines.forEach(m => {
    m.cells = {};
    const box = h('div','mach'), hd = h('div','mh');
    hd.append(h('b','mt','TR-' + m.kit + ' #' + m.n));
    const mute = h('button','sm' + (m.mute?' red':''),'Mute');
    mute.onclick = () => { m.mute = !m.mute; mute.classList.toggle('red',m.mute); if (m.out) m.out.gain.value = m.mute ? 0 : m.vol; };
    const clr = h('button','sm','Clear');
    clr.onclick = () => { commit(); const p = S.sections[S.view][m.id]; VOICES.forEach(([k]) => { p[k].fill(0); paint(m,k); }); };
    const sv = h('button','sm','Save preset'); sv.onclick = () => savePreset(m);
    const ld = h('button','sm','Load preset'); ld.onclick = () => openLoad(m);
    const del = h('button','sm','Remove');
    del.onclick = () => { commit(); if (m.out) m.out.disconnect(); S.machines = S.machines.filter(x => x!==m); S.sections.forEach(s => delete s[m.id]); render(); };
    hd.append(mute,clr,sv,ld,del,h('span','dim','Vol'),range(0,1,m.vol,v => { m.vol = v; if (m.out && !m.mute) m.out.gain.value = v; }));
    box.append(hd);
    VOICES.forEach(([k,label]) => {
      const row = h('div','row'), lb = h('button','lb',label), g = h('div','steps');
      lb.onpointerdown = e => { e.preventDefault(); initAudio(); trigger(m,k,0.9,ctx.currentTime+0.005); };
      m.cells[k] = [];
      for (let i=0;i<STEPS;i++){
        const b = h('div','st' + (i%4===0 && i ? ' g4' : ''));
        b.onpointerdown = e => { e.preventDefault(); commit(); const p = S.sections[S.view][m.id][k]; p[i] = (p[i]+1)%3; paint(m,k,i); };
        g.append(b); m.cells[k].push(b);
      }
      row.append(lb,g,range(0,1,m.vv[k],v => { m.vv[k] = v; },'vv'));
      box.append(row); paint(m,k);
    });
    rack.append(box);
  });
  ph = []; refreshSections();
}

/* ---------- wiring ---------- */
function setBpm(v){ S.bpm = Math.min(240,Math.max(40,Math.round(v)||120)); $('#bpm').value = S.bpm; }
$('#play').onclick = togglePlay;
$('#bm').onclick = () => setBpm(S.bpm-1);
$('#bp').onclick = () => setBpm(S.bpm+1);
$('#bpm').onchange = e => setBpm(parseFloat(e.target.value));
$('#mv').oninput = e => { S.mv = parseFloat(e.target.value); if (master) master.gain.value = S.mv; };
$('#secSel').onchange = e => { S.view = parseInt(e.target.value,10); render(); };
$('#addSec').onclick = newSection;
$('#copySec').onclick = copySection;
$('#pasteSec').onclick = pasteSection;
$('#add808').onclick = () => { commit(); addMachine('808'); render(); };
$('#add909').onclick = () => { commit(); addMachine('909'); render(); };
$('#undo').onclick = undo;
$('#redo').onclick = redo;

/* start: one TR-909 with a simple house beat so there is sound right away */
S.sections.push({});
const m0 = addMachine('909'), p0 = S.sections[0][m0.id];
p0.kick = P([0,4,8,12],[0]); p0.snare = P([4,12],[12]); p0.chh = P([0,4,8,12]); p0.ohh = P([2,6,10,14]);
render();
requestAnimationFrame(draw);
syncHist();
</script>
